plugins {
    id 'com.android.application'
}

def ciKeystorePath = System.getenv('KEYBOARD_DEBUG_KEYSTORE')
def useCiKeystore = ciKeystorePath != null && !ciKeystorePath.trim().isEmpty()

android {
    namespace 'com.keyboard.fuentes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.keyboard.fuentes'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // El workflow crea y conserva esta clave; en local se usa la debug por defecto.
        ci {
            storeFile file(useCiKeystore ? ciKeystorePath
                    : "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // APK instalable sin secretos, firmado con una clave de depuración.
            signingConfig(useCiKeystore ? signingConfigs.ci : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
